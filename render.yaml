services:
  # ─────────────────────────────────────────────────────────────
  # TeamFlow NestJS Backend API & WebSocket Gateway
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: teamflow-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teamflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"

databases:
  # ─────────────────────────────────────────────────────────────
  # Managed PostgreSQL Database
  # ─────────────────────────────────────────────────────────────
  - name: teamflow-db
    plan: free
    databaseName: teamflow
    user: teamflow_user
